name: art_inspiration_app
description: Art Inspiration - Cosmetics E-Commerce App
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # Storage
  shared_preferences: ^2.3.2

  # UI & Responsive
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  smooth_page_indicator: ^1.2.1
  carousel_slider: ^5.0.0

  # Images
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.1
  google_fonts: ^8.1.0

  # Network
  dio: ^5.7.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/artinslogo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: DINNextLTArabic
      fonts:
        - asset: assets/font/din_next_lt_arabic_light.ttf
          weight: 300
        - asset: assets/font/din_next_lt_arabic_regular.ttf
          weight: 400
        - asset: assets/font/din_next_lt_arabic_bold.ttf
          weight: 700
